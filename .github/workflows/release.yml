name: Signed Android Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHORTS_KEYSTORE_BASE64: ${{ secrets.SHORTS_KEYSTORE_BASE64 }}
      SHORTS_STORE_PASSWORD: ${{ secrets.SHORTS_STORE_PASSWORD }}
      SHORTS_KEY_ALIAS: ${{ secrets.SHORTS_KEY_ALIAS }}
      SHORTS_KEY_PASSWORD: ${{ secrets.SHORTS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Require permanent release signing credentials
        run: |
          for var in SHORTS_KEYSTORE_BASE64 SHORTS_STORE_PASSWORD SHORTS_KEY_ALIAS SHORTS_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing $var. Configure permanent Android signing before publishing releases."
              exit 1
            fi
          done
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode signing key
        run: |
          echo "$SHORTS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shorts-stable.jks"
          echo "SHORTS_KEYSTORE_PATH=$RUNNER_TEMP/shorts-stable.jks" >> "$GITHUB_ENV"
      - name: Compile signed APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists. Increase versionCode/versionName before publishing."
            exit 1
          fi
          VERSION_CODE="$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -n 1 | awk '{print $3}')"
          printf "versionCode: %s\\n\\nSigned Android APK.\\n" "$VERSION_CODE" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" app/build/outputs/apk/release/*.apk --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-creator-signed-release
          path: app/build/outputs/apk/release/*.apk
