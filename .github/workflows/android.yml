name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | head -n 1)"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || test ${PIPESTATUS[1]} -eq 0
      - name: Decode stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHORTS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shorts-stable.jks"
          fi
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SHORTS_KEYSTORE_BASE64 }}
          SHORTS_STORE_PASSWORD: ${{ secrets.SHORTS_STORE_PASSWORD }}
          SHORTS_KEY_ALIAS: ${{ secrets.SHORTS_KEY_ALIAS }}
          SHORTS_KEY_PASSWORD: ${{ secrets.SHORTS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            export SHORTS_KEYSTORE_PATH="$RUNNER_TEMP/shorts-stable.jks"
          fi
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-creator-v0.1-debug
          path: app/build/outputs/apk/debug/*.apk
